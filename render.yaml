services:
  - type: web
    name: taskflow-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-postgres
          property: connectionString

databases:
  - name: taskflow-postgres
    databaseName: taskflow
    plan: free
    region: oregon
    ipAllowList: []
